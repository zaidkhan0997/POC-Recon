name: Build & Release Standalone Binaries & Desktop Software

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli-binaries:
    name: Build CLI (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            arch: x64
            asset_name: poc-recon-windows-x64.exe
            output_binary: dist/poc-recon-windows-x64.exe

          # Linux x64
          - os: ubuntu-latest
            arch: x64
            asset_name: poc-recon-linux-x64
            output_binary: dist/poc-recon-linux-x64

          # macOS (Apple Silicon & Intel)
          - os: macos-latest
            arch: arm64
            asset_name: poc-recon-macos-arm64
            output_binary: dist/poc-recon-macos-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --clean -y poc-recon.spec
          if [ -f "dist/poc-recon.exe" ]; then
            mv "dist/poc-recon.exe" "${{ matrix.output_binary }}"
          elif [ -f "dist/poc-recon" ]; then
            mv "dist/poc-recon" "${{ matrix.output_binary }}"
          fi
          ls -la dist/

      - name: Test Executable Help Output
        shell: bash
        run: |
          chmod +x ${{ matrix.output_binary }} || true
          ${{ matrix.output_binary }} --help

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.output_binary }}

  build-desktop-gui:
    name: Build Desktop GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: poc-recon-desktop-windows-x64.exe
            output_path: poc-recon-desktop/build/bin/poc-recon-desktop-windows-x64.exe

          - os: ubuntu-latest
            asset_name: poc-recon-desktop-linux-x64
            output_path: poc-recon-desktop/build/bin/poc-recon-desktop-linux-x64

          - os: macos-latest
            asset_name: poc-recon-desktop-macos.zip
            output_path: poc-recon-desktop/build/bin/poc-recon-desktop-macos.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Desktop GUI for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          cd poc-recon-desktop
          wails build -platform windows/amd64 -o poc-recon-desktop-windows-x64.exe

      - name: Build Desktop GUI for Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          cd poc-recon-desktop
          wails build -platform linux/amd64 -tags webkit2_41 -o poc-recon-desktop-linux-x64

      - name: Build Desktop GUI for macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          cd poc-recon-desktop
          wails build -platform darwin/universal -o poc-recon-desktop
          cd build/bin
          zip -r poc-recon-desktop-macos.zip "POC-Recon — Business Email Intelligence Suite.app" || zip -r poc-recon-desktop-macos.zip *.app || zip -r poc-recon-desktop-macos.zip poc-recon-desktop

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.output_path }}

  publish-release:
    name: Create GitHub Release
    needs: [build-cli-binaries, build-desktop-gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Prepare Assets for Release
        run: |
          mkdir -p release-dist
          find release-binaries -type f -exec mv {} release-dist/ \;
          ls -la release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
