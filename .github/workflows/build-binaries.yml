name: Build & Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            arch: x64
            asset_name: poc-recon-windows-x64.exe
            output_binary: dist/poc-recon-windows-x64.exe

          # Linux x64
          - os: ubuntu-latest
            arch: x64
            asset_name: poc-recon-linux-x64
            output_binary: dist/poc-recon-linux-x64

          # macOS (Intel & Apple Silicon)
          - os: macos-latest
            arch: arm64
            asset_name: poc-recon-macos-arm64
            output_binary: dist/poc-recon-macos-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          pyinstaller --clean -y poc-recon.spec
          if [ -f "dist/poc-recon.exe" ]; then
            mv "dist/poc-recon.exe" "${{ matrix.output_binary }}"
          elif [ -f "dist/poc-recon" ]; then
            mv "dist/poc-recon" "${{ matrix.output_binary }}"
          fi
          ls -la dist/

      - name: Test Executable Help Output
        shell: bash
        run: |
          chmod +x ${{ matrix.output_binary }} || true
          ${{ matrix.output_binary }} --help

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.output_binary }}

  publish-release:
    name: Create GitHub Release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Prepare Assets for Release
        run: |
          mkdir -p release-dist
          find release-binaries -type f -exec mv {} release-dist/ \;
          ls -la release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
