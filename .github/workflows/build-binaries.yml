name: Build & Release Standalone Binaries & Desktop Software

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build-cli:
    name: Test & Cross-Compile CLI Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run Go Unit Tests
        run: |
          go test -v ./...

      - name: Cross-Compile Standalone Binaries
        run: |
          mkdir -p dist/

          echo "[*] Building Linux x64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/poc-recon-linux-x64 ./cmd/poc-recon

          echo "[*] Building Linux arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/poc-recon-linux-arm64 ./cmd/poc-recon

          echo "[*] Building Windows x64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/poc-recon-windows-x64.exe ./cmd/poc-recon

          echo "[*] Building macOS Intel (amd64)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/poc-recon-macos-x64 ./cmd/poc-recon

          echo "[*] Building macOS Apple Silicon (arm64)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/poc-recon-macos-arm64 ./cmd/poc-recon

          ls -lh dist/

      - name: Test Native Linux Binary Help Output
        run: |
          chmod +x dist/poc-recon-linux-x64
          ./dist/poc-recon-linux-x64 --help

      - name: Upload Linux x64 CLI
        uses: actions/upload-artifact@v4
        with:
          name: poc-recon-linux-x64
          path: dist/poc-recon-linux-x64

      - name: Upload Linux arm64 CLI
        uses: actions/upload-artifact@v4
        with:
          name: poc-recon-linux-arm64
          path: dist/poc-recon-linux-arm64

      - name: Upload Windows x64 CLI
        uses: actions/upload-artifact@v4
        with:
          name: poc-recon-windows-x64.exe
          path: dist/poc-recon-windows-x64.exe

      - name: Upload macOS x64 CLI
        uses: actions/upload-artifact@v4
        with:
          name: poc-recon-macos-x64
          path: dist/poc-recon-macos-x64

      - name: Upload macOS arm64 CLI
        uses: actions/upload-artifact@v4
        with:
          name: poc-recon-macos-arm64
          path: dist/poc-recon-macos-arm64

  build-desktop-gui:
    name: Build Desktop GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: poc-recon-desktop-windows-x64.exe
            output_path: poc-recon-desktop/build/bin/poc-recon-desktop-windows-x64.exe

          - os: ubuntu-latest
            asset_name: poc-recon-desktop-linux-x64
            output_path: poc-recon-desktop/build/bin/poc-recon-desktop-linux-x64

          - os: macos-latest
            asset_name: poc-recon-desktop-macos.zip
            output_path: poc-recon-desktop/build/bin/poc-recon-desktop-macos.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Desktop GUI for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          cd poc-recon-desktop
          wails build -platform windows/amd64 -o poc-recon-desktop-windows-x64.exe

      - name: Build Desktop GUI for Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          cd poc-recon-desktop
          wails build -platform linux/amd64 -tags webkit2_41 -o poc-recon-desktop-linux-x64

      - name: Build Desktop GUI for macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          cd poc-recon-desktop
          wails build -platform darwin/universal -o poc-recon-desktop
          cd build/bin
          zip -r poc-recon-desktop-macos.zip "POC-Recon — Business Email Intelligence Suite.app" || zip -r poc-recon-desktop-macos.zip *.app || zip -r poc-recon-desktop-macos.zip poc-recon-desktop

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.output_path }}

  publish-release:
    name: Create GitHub Release
    needs: [test-and-build-cli, build-desktop-gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Prepare Assets for Release
        run: |
          mkdir -p release-dist
          find release-binaries -type f -exec mv {} release-dist/ \;
          ls -la release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
